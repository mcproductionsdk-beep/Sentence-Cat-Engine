<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sentence Cat | Staging preview</title>
  <link rel="stylesheet" href="./engine/cat.css">
  <script src="./engine/lifecycle.js" defer></script>
<script src="./engine/cat.js" defer></script>
  <script type="module" src="./engine/sentence-session.mjs"></script>
</head>
<body>
  <section id="preview" aria-labelledby="preview-title">
    <h1 id="preview-title">Sentence Cat staging preview</h1>
    <p>Play a fixed Spanish sample using arrow keys or swipes. This preview uses sample sentences only.</p>
    <button id="play">Play sample</button>
  </section>
  <main hidden><header class="top"><div><h1 class="logo">Sentence Cat</h1></div><div class="progress" id="progress"></div></header>
    <nav class="actions" aria-label="Game controls">
      <button id="pause">Pause</button>
      <button id="restart">Restart</button>
      <button id="menu">Main Menu</button>
      <button id="sound" aria-pressed="true"><span id="sound-icon" aria-hidden="true">🔊</span> <span id="sound-label">Sound On</span></button>
    </nav>
    <section class="panel"><div class="labels">Move the cat to build the sentence</div><p class="prompt" id="english"></p><div class="labels">BUILD THE SENTENCE</div><div class="sentence" id="sentence"></div></section><section class="game"><div class="grid" id="grid" aria-label="3 by 3 word selection grid"></div><div class="overlay" id="overlay" hidden aria-live="assertive"><div id="overlayContent"></div></div></section><div class="status" id="status" aria-live="polite">Swipe to help the cat catch the correct mouse.</div></main>
</body>
</html>
